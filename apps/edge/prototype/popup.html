<!doctype html>
<html lang="en-AU">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voda Lens</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <header class="brand"><span class="brand-mark" aria-hidden="true">v.</span><span>Voda <strong>Lens</strong></span></header>
  <h1>A clearer view of your data.</h1>
  <p class="muted">Use your signed-in My Vodafone tab. Captures stay in this browser.</p>
  <button class="button primary full" id="sync-all">Sync all services</button>
  <button class="button full" id="sync-page">Capture this page</button>
  <label class="check"><input type="checkbox" id="load-more" checked> Load all “Show more” batches</label>
  <p class="small muted">Sync all services visits each line’s Usage tab. For a custom date range, set it on Vodafone and use Capture this page.</p>
  <p id="popup-status" role="status" aria-live="polite"></p>
  <button class="text-button" id="open-dashboard">Open dashboard <span aria-hidden="true">↗</span></button>
  <script src="popup.js"></script>
</body>
</html>
