name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Check public source and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python3 scripts/check-publication.py
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'versionName = "([^"]+)"', Path('apps/android/app/build.gradle.kts').read_text())[1]
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'A stable release tag is required'
          assert tag == 'v' + version, 'Tag must match Android versionName'
          assert Path('docs/releases/' + tag + '.md').is_file(), 'Release notes required'
          PY
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Check shared code
        run: |
          npm test
          npm run check
          python3 -m unittest discover -s tests -p test_publication.py
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vodalens-release.jks"
      - name: Test and build signed Android APK
        working-directory: apps/android
        env:
          VODALENS_SIGNING_STORE: ${{ runner.temp }}/vodalens-release.jks
          VODALENS_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Verify and package APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          cp apps/android/app/build/outputs/apk/release/app-release.apk "release-assets/VodaLens-${RELEASE_TAG#v}.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "release-assets/VodaLens-${RELEASE_TAG#v}.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "VodaLens AU $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/vodalens-release.jks"
