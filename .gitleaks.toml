title = "VodaLens publication checks"
[extend]
useDefault = true

# Chrome's manifest key is a public RSA key used only to keep the extension ID
# stable. This exception requires both this exact public-key line and path;
# other secrets in the same manifest continue to be scanned.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Known public extension identity key, not a private signing key"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)apps/edge/session-bridge/manifest\.json$''']
regexes = ['''^\s*"key":\s*"MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA22MiycH7eSE8yr5KMp8NjHZ1ireTm1mRbsJgvR90O6B6tFwEF4fWkeEpSARZ6WGr1SC4NpFtJT54s4pifHY5wguUSmJj6EZdRDDr7\+VEixRgFJbM1ZPXJ4uQwDxEK/rXFYUSftOIcKVsN8DW7pjvk1iMcSP7XKHc5hsFRmQz/StCAaC0uUy4dIGczHvHbctHgjdTIG/WCvmXkGy\+mgZH5GL1/ZfesLSkLtV3VEcvcA242hYs9Aq6qKXPOGmUTz819\+mR/FzqblOw4VRBYqmK1gcxLAAW5C8umbejUrWbkju4WC1QdQQW1iLIw\+TBUZZ6yyDBiQrd/O3btZsE5a4\+3wIDAQAB",?\s*$''']
